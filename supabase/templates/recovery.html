<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupera tu acceso a Patzi</title></head>
<body style="margin:0;background:#eef4f1;font-family:Arial,Helvetica,sans-serif;color:#071a2d">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef4f1;padding:32px 12px"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;overflow:hidden;border:1px solid #dfe8e3;border-radius:28px;background:#fff;box-shadow:0 22px 55px rgba(7,26,45,.10)">
      <tr><td style="height:8px;background:linear-gradient(90deg,#ff765b 0 42%,#4de2b5 58% 100%)"></td></tr>
      <tr><td style="padding:34px 38px 12px;font-size:28px;font-weight:800;letter-spacing:-1.5px">Patzi<span style="color:#0aa883">.</span></td></tr>
      <tr><td style="padding:18px 38px 38px">
        <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.8px;color:#087f62">RECUPERACIÓN SEGURA</p>
        <h1 style="margin:0;font-size:34px;line-height:1.08;letter-spacing:-1.4px">Crea una nueva contraseña</h1>
        <p style="margin:18px 0 0;font-size:15px;line-height:1.7;color:#526474">Recibimos una solicitud para recuperar tu cuenta Patzi. Continúa únicamente si fuiste tú.</p>
        <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0"><tr><td style="border-radius:14px;background:#071a2d"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 28px;font-size:14px;font-weight:700;text-decoration:none;color:#fff">Restablecer contraseña&nbsp;&nbsp;→</a></td></tr></table>
        <div style="border-radius:16px;background:#fff0ec;padding:16px;font-size:12px;line-height:1.6;color:#a64f3e">Si no solicitaste este cambio, ignora el mensaje. Tu contraseña actual seguirá funcionando.</div>
      </td></tr>
      <tr><td style="border-top:1px solid #e6ece8;padding:20px 38px;font-size:11px;color:#8a989f">Patzi · Acceso protegido.</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
